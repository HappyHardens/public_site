# HappyHardens.com game library. CouchDoodle is hosted separately.
services:
  - type: web
    name: happy-hardens
    runtime: static
    repo: https://github.com/HappyHardens/public_site
    branch: main
    autoDeployTrigger: commit
    buildCommand: mkdir -p dist && cp index.html privacy.html support.html dist/ && cp -R assets dist/
    staticPublishPath: ./dist
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
